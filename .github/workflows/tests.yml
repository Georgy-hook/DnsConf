name: Tests
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - run: mvn -B test
